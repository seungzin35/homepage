name: Deploy to GitHub Pages

# 수동 실행 전용입니다. 수정 사항을 모아 두었다가 배포할 때 Actions 탭에서 실행합니다.
# (저장소 Settings → Pages → Source 는 "GitHub Actions" 로 설정되어 있어야 합니다.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # GitHub Pages 주소(예: https://<user>.github.io/<repo>)에 맞게 site/base 를 빌드 시점에만 바꿉니다.
      # 커스텀 도메인을 연결하면 base 는 자동으로 '/' 가 됩니다.
      - name: Point site config at GitHub Pages URL
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i "s|^  site: .*|  site: '${ORIGIN}'|" src/config.yaml
          sed -i "s|^  base: .*|  base: '${BASE_PATH:-/}'|" src/config.yaml
          grep -E '^  (site|base):' src/config.yaml

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
