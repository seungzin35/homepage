name: Deploy to GitHub Pages

# 수동 실행 전용입니다. 먼저 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꾼 뒤
# Actions 탭에서 이 워크플로를 실행하세요. 자동 배포를 원하면 아래 push 트리거 주석을 해제하세요.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # GitHub Pages 주소(예: https://<user>.github.io/<repo>)에 맞게 site/base 를 빌드 시점에만 바꿉니다.
      # 커스텀 도메인을 연결하면 base 는 자동으로 '/' 가 됩니다.
      - name: Point site config at GitHub Pages URL
        env:
          ORIGIN: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          sed -i "s|^  site: .*|  site: '${ORIGIN}'|" src/config.yaml
          sed -i "s|^  base: .*|  base: '${BASE_PATH:-/}'|" src/config.yaml
          grep -E '^  (site|base):' src/config.yaml

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
